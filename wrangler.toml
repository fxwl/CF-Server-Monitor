# Existing upstream app plus the additive network diagnostics wrapper.
name = "cf-server-monitor"
main = "src/network-entry.js"
compatibility_date = "2024-12-01"
compatibility_flags = ["nodejs_compat"]
keep_vars = true

[triggers]
crons = ["*/1 * * * *", "0 * * * *"]

[assets]
directory = "./dist"
binding = "ASSETS"
# Serve the live homepage through Worker to inject the theme-independent netdiag panel.
run_worker_first = ["/", "/netdiag", "/netdiag/*", "/api/netdiag/*"]

[[d1_databases]]
binding = "DB"
database_name = "server-monitor-db"
database_id = "064088a9-cc83-42b8-973e-8494bcaf0b71"

[[durable_objects.bindings]]
name = "METRICS_BROADCASTER"
class_name = "MetricsBroadcaster"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["MetricsBroadcaster"]

[dev]
port = 8787
local_protocol = "https"
