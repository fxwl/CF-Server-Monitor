# CFSM 2.8.7 original monitor (without external IP/route diagnostics)
name = "cf-server-monitor"
main = "src/index.js"
compatibility_date = "2024-12-01"
compatibility_flags = ["nodejs_compat"]
keep_vars = true

# Original live resources, alerts, and Fuzhou CU/CT/CM latency monitoring
[triggers]
crons = ["*/1 * * * *", "0 * * * *"]

[assets]
directory = "./dist"
binding = "ASSETS"

[[d1_databases]]
binding = "DB"
database_name = "server-monitor-db"
database_id = "064088a9-cc83-42b8-973e-8494bcaf0b71"

[[durable_objects.bindings]]
name = "METRICS_BROADCASTER"
class_name = "MetricsBroadcaster"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["MetricsBroadcaster"]

[dev]
port = 8787
local_protocol = "https"
