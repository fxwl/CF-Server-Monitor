name: Verify ICMP Agent and Monitor
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.3'
      - run: npm ci
      - run: node --test test/agent-timestamp-guard.test.js
      - run: npm test
      - run: node --test test/independent-quality.test.js
      - run: python3 -m py_compile public/quality/collector.py
      - run: python3 test/quality-collector-error.test.py
      - run: python3 test/quality-upstream-ipv4.test.py
      - run: python3 test/quality-vendor-mirror.test.py
      - run: python3 test/quality-retry-backoff.test.py
      - run: bash -n public/quality/install.sh
      - run: |
          set -eu
          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT
          printf 'SERVER_ID="01234567-89ab-cdef-0123-456789abcdef"\nSECRET="fake-test-key-12345678901234567890"\n' > "$tmp/config.conf"
          sudo env CFSM_PROBE_CONFIG="$tmp/config.conf" CFSM_QUALITY_PREFLIGHT_ONLY=1 bash public/quality/install.sh
          if sudo env CFSM_PROBE_CONFIG="$tmp/missing.conf" CFSM_QUALITY_PREFLIGHT_ONLY=1 bash public/quality/install.sh; then
            echo 'Missing file must fail the preflight' >&2
            exit 1
          fi
      - run: npm run test:history-query
      - run: bash scripts/build-icmp-agent.sh
      - run: node scripts/verify-release.mjs
      - run: CFSM_SKIP_MKCERT=1 npm run build:frontend
      - run: npx --no-install wrangler deploy --dry-run
      - run: |
          test -s dist/agent/install.sh
          test -s dist/agent/sha256sums.txt
          test -x dist/agent/cf-probe-linux-amd64
          test -x dist/agent/cf-probe-linux-arm64
          (cd dist/agent && sha256sum -c sha256sums.txt)
