name: Upstream Review (Frozen Release)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  review-policy:
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo 'This customized release is frozen by owner request.'
          echo 'Automatic upstream synchronization is disabled.'
          echo 'Review necessary security/reliability changes in a separate branch and run the complete release checks.'
          echo 'Never force-reset main or replace the pinned theme/agent without approval.'
