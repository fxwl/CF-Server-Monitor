name: Manual Production Release
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: cfsm-manual-production
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.22.1'
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.3'
      - name: Validate manual deployment credentials
        run: |
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo 'Use the connected Cloudflare Workers Builds pipeline, or configure CF_ACCOUNT_ID for this optional manual workflow.'; exit 1; }
          test -n "$CLOUDFLARE_API_TOKEN"
      - run: npm ci
      - run: bash scripts/release-build.sh
      - name: Deploy the committed production configuration without rewriting it
        run: npx --no-install wrangler deploy
